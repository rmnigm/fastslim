[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "fastslim"
description = "SLIM (Sparse Linear Methods) recommender system in Rust"
authors = [
  { name = "Roman Nigmatullin", email = "roman.nigmatullinm@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "slim",
    "recommender-system",
    "collaborative-filtering",
    "item-item",
    "sparse",
    "rust",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]
# Single-sourced from Cargo.toml by maturin.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/rmnigm/fastslim"
Repository = "https://github.com/rmnigm/fastslim"
Issues = "https://github.com/rmnigm/fastslim/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.16.6",
    "pre-commit>=3",
    "hypothesis>=6",
]
bench = [
    "implicit>=0.7",
    "h5py>=3.10",
    "rich>=13",
    "tqdm>=4.66",
]

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "fastslim.native"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
# A truncated fit in a test is a bug unless the test says otherwise.
filterwarnings = ["error::fastslim.ConvergenceWarning"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
