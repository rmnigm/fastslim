name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# The crate is built with pyo3's `abi3-py310` feature, so a single wheel per
# platform covers CPython 3.10+. No per-Python-version build matrix is needed.
jobs:
  linux:
    name: Wheel (linux-${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for both architectures: no QEMU/cross-compilation,
          # so the wheels can also be smoke-tested on the machine that built them.
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # `auto` picks the newest manylinux the current Rust toolchain can
          # target (manylinux_2_28 today) and falls back if that is unavailable.
          manylinux: auto
          args: --release --out dist
          sccache: "true"
      - name: Smoke-test wheel
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/smoke"
          python -m venv "$VENV"
          PY="$VENV/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl
          "$PY" -c "import fastslim, numpy, scipy; print(fastslim.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  macos:
    name: Wheel (macos-universal2)
    runs-on: macos-latest
    # macos-latest is Apple silicon. A single `universal2` wheel serves both
    # arm64 and Intel Macs, which avoids depending on the deprecated Intel
    # runner images (macos-13) for a separate x86_64 build.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --release --out dist
          sccache: "true"
      - name: Smoke-test wheel
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/smoke"
          python -m venv "$VENV"
          PY="$VENV/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl
          "$PY" -c "import fastslim, numpy, scipy; print(fastslim.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-universal2
          path: dist/*.whl
          if-no-files-found: error

  windows:
    name: Wheel (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: x64
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          sccache: "true"
      - name: Smoke-test wheel
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/smoke"
          python -m venv "$VENV"
          PY="$VENV/Scripts/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl
          "$PY" -c "import fastslim, numpy, scipy; print(fastslim.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x64
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    permissions:
      # Required for PyPI trusted publishing (OIDC).
      id-token: write
    # If the PyPI trusted publisher for this project is configured with a
    # GitHub environment, uncomment and set it to the same name:
    # environment: pypi
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: List distributions
        run: ls -l dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
