name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  Publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Build
        run: |
          cd slim-rs
          uv build --sdist
      - name: Publish
        run: |
          cd slim-rs
          uv publish
